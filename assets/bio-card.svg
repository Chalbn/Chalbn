<svg xmlns="http://www.w3.org/2000/svg" width="850" height="220" viewBox="0 0 850 220">
  <rect width="850" height="220" rx="14" fill="#111C18" stroke="#2B493E" stroke-width="2" />
  <rect width="850" height="38" rx="14" fill="#182822" />

  <!-- Tab Kiri -->
  <rect x="20" y="8" width="160" height="24" rx="6" fill="#111C18" />
  <circle cx="36" cy="20" r="4" fill="#74C69D" />
  <text x="48" y="24" fill="#D8F3DC" font-family="monospace" font-size="12">chalbn.config.json</text>

  <!-- Indikator Live -->
  <circle cx="755" cy="20" r="4" fill="#74C69D">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <text x="766" y="24" fill="#95D5B2" font-family="monospace" font-size="11">ONLINE</text>

  <!-- Garis Pemisah Tengah -->
  <line x1="535" y1="50" x2="535" y2="205" stroke="#233D34" stroke-width="1.5" />

  <!-- Panel Kiri: JSON -->
  <text x="28" y="68" fill="#74C69D" font-family="monospace" font-size="13.5">{</text>
  <text x="46" y="92" fill="#E8F5E9" font-family="monospace" font-size="13.5">"username": "Chalbn",</text>
  <text x="46" y="116" fill="#E8F5E9" font-family="monospace" font-size="13.5">"stack": ["PHP", "Laravel", "MySQL", "Python"],</text>
  <text x="46" y="140" fill="#E8F5E9" font-family="monospace" font-size="13.5">"focus": ["Backend", "DB Routines", "RDF/OWL"],</text>
  <text x="46" y="164" fill="#B7E4C7" font-family="monospace" font-size="13.5">"status": "Building clean &amp; structured web apps"</text>
  <text x="28" y="188" fill="#74C69D" font-family="monospace" font-size="13.5">}</text>

  <rect x="44" y="176" width="8" height="15" fill="#74C69D">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>

  <!-- Panel Kanan: Core Focus Bars -->
  <text x="558" y="68" fill="#95D5B2" font-family="monospace" font-size="12.5" font-weight="bold">// CORE FOCUS METRICS</text>

  <text x="558" y="96" fill="#D8F3DC" font-family="monospace" font-size="12">Backend &amp; Laravel</text>
  <rect x="558" y="103" width="260" height="8" rx="4" fill="#1B332B" />
  <rect x="558" y="103" width="235" height="8" rx="4" fill="#74C69D">
    <animate attributeName="width" from="0" to="235" dur="1.4s" fill="freeze" />
  </rect>

  <text x="558" y="136" fill="#D8F3DC" font-family="monospace" font-size="12">MySQL &amp; DB Security</text>
  <rect x="558" y="143" width="260" height="8" rx="4" fill="#1B332B" />
  <rect x="558" y="143" width="220" height="8" rx="4" fill="#52B788">
    <animate attributeName="width" from="0" to="220" dur="1.6s" fill="freeze" />
  </rect>

  <text x="558" y="176" fill="#D8F3DC" font-family="monospace" font-size="12">Python &amp; Semantic Web</text>
  <rect x="558" y="183" width="260" height="8" rx="4" fill="#1B332B" />
  <rect x="558" y="183" width="195" height="8" rx="4" fill="#95D5B2">
    <animate attributeName="width" from="0" to="195" dur="1.8s" fill="freeze" />
  </rect>
</svg>