<svg xmlns="http://www.w3.org/2000/svg" width="850" height="175" viewBox="0 0 850 175">
  <!-- KARTU KIRI: PASKA-JAYA -->
  <rect x="0" y="0" width="415" height="175" rx="14" fill="#13221D" stroke="#2D4F43" stroke-width="1.8" />
  <rect x="0" y="0" width="6" height="175" rx="3" fill="#74C69D" />
  
  <circle cx="32" cy="34" r="5" fill="#74C69D">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="46" y="39" fill="#E8F5E9" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold">
    PASKA-JAYA Management System
  </text>
  <rect x="330" y="21" width="68" height="22" rx="11" fill="#1E382F" stroke="#52B788" stroke-width="1" />
  <text x="364" y="36" fill="#95D5B2" font-family="monospace" font-size="11" text-anchor="middle">FEATURED</text>

  <text x="26" y="68" fill="#B7E4C7" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    Multi-role web application for store operations with
  </text>
  <text x="26" y="86" fill="#B7E4C7" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    stored procedures, triggers &amp; role privilege isolation.
  </text>

  <!-- Tech Pills Kartu Kiri -->
  <rect x="26" y="118" width="72" height="24" rx="12" fill="#1B332B" stroke="#52B788" stroke-width="1" />
  <text x="62" y="134" fill="#D8F3DC" font-family="monospace" font-size="11" text-anchor="middle">Laravel</text>

  <rect x="106" y="118" width="64" height="24" rx="12" fill="#1B332B" stroke="#52B788" stroke-width="1" />
  <text x="138" y="134" fill="#D8F3DC" font-family="monospace" font-size="11" text-anchor="middle">MySQL</text>

  <rect x="178" y="118" width="82" height="24" rx="12" fill="#1B332B" stroke="#52B788" stroke-width="1" />
  <text x="219" y="134" fill="#D8F3DC" font-family="monospace" font-size="11" text-anchor="middle">Tailwind</text>

  <!-- KARTU KANAN: SEMANTIC WEB -->
  <rect x="435" y="0" width="415" height="175" rx="14" fill="#13221D" stroke="#2D4F43" stroke-width="1.8" />
  <rect x="435" y="0" width="6" height="175" rx="3" fill="#52B788" />

  <circle cx="467" cy="34" r="5" fill="#95D5B2">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <text x="481" y="39" fill="#E8F5E9" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold">
    Semantic Web &amp; OWL Reasoner
  </text>
  <rect x="765" y="21" width="68" height="22" rx="11" fill="#1E382F" stroke="#52B788" stroke-width="1" />
  <text x="799" y="36" fill="#95D5B2" font-family="monospace" font-size="11" text-anchor="middle">RESEARCH</text>

  <text x="461" y="68" fill="#B7E4C7" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    Deductive closure reasoning and SPARQL querying
  </text>
  <text x="461" y="86" fill="#B7E4C7" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    over RDFS &amp; OWL Turtle knowledge graph ontologies.
  </text>

  <!-- Tech Pills Kartu Kanan -->
  <rect x="461" y="118" width="68" height="24" rx="12" fill="#1B332B" stroke="#52B788" stroke-width="1" />
  <text x="495" y="134" fill="#D8F3DC" font-family="monospace" font-size="11" text-anchor="middle">Python</text>

  <rect x="537" y="118" width="72" height="24" rx="12" fill="#1B332B" stroke="#52B788" stroke-width="1" />
  <text x="573" y="134" fill="#D8F3DC" font-family="monospace" font-size="11" text-anchor="middle">RDFlib</text>

  <rect x="617" y="118" width="72" height="24" rx="12" fill="#1B332B" stroke="#52B788" stroke-width="1" />
  <text x="653" y="134" fill="#D8F3DC" font-family="monospace" font-size="11" text-anchor="middle">SPARQL</text>
</svg>